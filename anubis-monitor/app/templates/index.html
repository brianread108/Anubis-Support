<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="{{ refresh }}">
  <title>Anubis Monitor</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #ddd; text-align: left; }
    .healthy { color: green; }
    .degraded { color: orange; }
    .down { color: red; }
  </style>
</head>
<body>
  <h1>Anubis Monitor</h1>
  <p>Last updated: {{ last_updated }}</p>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Last seen</th>
        <th>Error</th>
      </tr>
    </thead>
    <tbody>
      {% for inst in instances %}
      <tr>
        <td>{{ inst.name }}</td>
        <td class="{{ status_label(inst) }}">{{ status_label(inst) }}</td>
        <td>{{ inst.last_seen }}</td>
        <td>{{ inst.error }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
