<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="{{ refresh }}">
  <title>Anubis Monitor</title>
</head>
<body>
  <h1>Anubis Monitor</h1>
  <p>Last updated: {{ last_updated }}</p>

  <ul>
    {% for inst in instances %}
      <li>
        <strong>{{ inst.name }}</strong> —
        {% if inst.healthy %}Healthy{% else %}Down{% endif %}
        {% if inst.error %} ({{ inst.error }}){% endif %}
      </li>
    {% endfor %}
  </ul>
</body>
</html>
